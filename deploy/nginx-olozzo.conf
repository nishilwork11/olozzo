# nginx site for olozzo (see docs/SELF_HOSTING.md). Copy to /etc/nginx/sites-available/olozzo.
# Port 80 only — `certbot --nginx` adds HTTPS and the http→https redirect to both blocks.

# www.olozzo.com: the shop (Next.js on 127.0.0.1:3100)
server {
    listen 80;
    listen [::]:80;
    server_name www.olozzo.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# olozzo.com → https://www.olozzo.com (as Vercel did). The redirect sits inside `location /`,
# so certbot's certificate check under /.well-known/acme-challenge/ still gets through.
server {
    listen 80;
    listen [::]:80;
    server_name olozzo.com;

    location / {
        return 301 https://www.olozzo.com$request_uri;
    }
}
